<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Baseball Log</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#73777d;--line:#e1e4e8;--blue:#eaf2ff;--red:#d93025}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:14px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:850}.top{width:42px;height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:20px}main{max-width:900px;margin:auto;padding:14px 12px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}.hidden{display:none!important}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.title{font-size:20px;font-weight:850}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:750;background:#eceef1}.primary{background:#111;color:#fff}.blue{background:var(--blue);color:#1463d8}.danger{background:#fff0ef;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#f7f7f8;border-radius:12px;padding:11px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:19px}.tablewrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}.table th,.table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.table th:first-child,.table td:first-child{text-align:left;position:sticky;left:0;background:#fff}.score{display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:center}.scorebox{background:#f7f7f8;border-radius:14px;padding:11px}.scorebox .n{font-size:34px;font-weight:900}.inning{display:grid;grid-template-columns:105px repeat(9,48px) 55px;min-width:592px}.inning>div{padding:8px 3px;border-bottom:1px solid var(--line);text-align:center}.head{background:#dfe1e3;font-weight:850}.cell{width:100%;min-height:34px;border:0;background:transparent;font-weight:800}.editor{display:grid;grid-template-columns:160px repeat(10,58px);min-width:740px}.editor>div{border-bottom:1px solid #d5d8dc;border-right:1px solid #d5d8dc;padding:5px;text-align:center;font-size:12px}.editor .p{background:#f0f0f0;text-align:left;font-weight:800;position:sticky;left:0;z-index:2}.line{display:grid;grid-template-columns:42px 1fr 70px;gap:5px;margin:5px 0}.line>*{padding:8px;background:#f7f7f8;border:0;border-radius:7px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.bottom button{flex:1;border:0;background:transparent;color:#666;padding:5px;font-size:12px}.bottom .active{color:#111;font-weight:850}.menu{position:fixed;right:12px;top:65px;z-index:50;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 8px 30px #0002}.menu button{display:block;width:220px;text-align:left;border:0;background:#fff;padding:12px;border-radius:9px;font:inherit}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}

.game-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:700}
.quick.active{background:#111;color:#fff}
.lineup-grid{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;align-items:center}
.lineup-grid .head{font-size:12px;color:var(--muted);font-weight:700;padding:4px}
.lineup-grid .slot{background:#f7f7f8;border-radius:10px;padding:9px}
.result-grid{display:grid;grid-template-columns:repeat(5,minmax(74px,1fr));gap:6px;min-width:410px}
.result-grid button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 4px;font-weight:700}
.result-grid button:active{transform:scale(.98)}
@media(max-width:560px){.result-grid{grid-template-columns:repeat(3,minmax(74px,1fr))}.gameBat .editor{min-width:0}}
</style></head><body><header><div class="logo">⚾ Baseball Log</div><button class="top" id="menuBtn">☰</button></header><main>
<section id="home"><div class="card"><div class="row between"><div><div class="muted">今シーズン</div><div class="title" id="teamTitle">チーム成績</div></div><button class="btn primary" id="addGame">＋ 試合</button></div></div><div class="card"><div class="stats"><div class="stat"><small>試合</small><strong id="g">0</strong></div><div class="stat"><small>勝率</small><strong id="wr">.000</strong></div><div class="stat"><small>得点</small><strong id="rs">0</strong></div><div class="stat"><small>失点</small><strong id="ra">0</strong></div><div class="stat"><small>打率</small><strong id="avg">.000</strong></div><div class="stat"><small>本塁打</small><strong id="hr">0</strong></div><div class="stat"><small>盗塁</small><strong id="sb">0</strong></div><div class="stat"><small>防御率</small><strong id="era">0.00</strong></div></div></div><div class="card"><b>チーム打撃成績</b><div class="tablewrap"><table class="table"><thead><tr><th>選手</th><th>打席</th><th>打数</th><th>安打</th><th>二塁打</th><th>三塁打</th><th>本塁打</th><th>打点</th><th>得点</th><th>四球</th><th>三振</th><th>打率</th><th>出塁率</th></tr></thead><tbody id="batRows"></tbody></table></div></div><div class="card"><b>チーム投手成績</b><div class="tablewrap"><table class="table"><thead><tr><th>投手</th><th>登板</th><th>投球回</th><th>勝</th><th>負</th><th>セーブ</th><th>奪三振</th><th>被安打</th><th>自責点</th><th>防御率</th></tr></thead><tbody id="pitchRows"></tbody></table></div></div></section>
<section id="games" class="hidden"><div class="card"><div class="row between"><div class="title">試合一覧</div><button class="btn primary" id="addGame2">＋ 新しい試合</button></div></div><div id="gameList"></div></section>
<section id="game" class="hidden">
<div class="row" style="margin-bottom:10px"><button class="btn" id="backGames">← 試合一覧</button></div>

<div class="card">
  <div class="row between">
    <div><div class="muted" id="date"></div><div class="title" id="oppTitle">試合</div></div>
    <button class="btn blue" id="finish">試合終了</button>
  </div>
  <div class="score" style="margin-top:10px">
    <div class="scorebox"><b id="ourName">自チーム</b><div class="n" id="ourScore">0</div></div>
    <div class="scorebox"><b id="oppName">相手</b><div class="n" id="oppScore">0</div></div>
  </div>
</div>

<div class="card">
  <b>スタメン</b>
  <div class="muted" style="margin:7px 0">打順・選手を確認しながら試合中に入力できます。</div>
  <div id="lineup"></div>
</div>

<div class="card">
  <div class="row between"><b>イニング</b><span class="muted">得点をタップ</span></div>
  <div class="tablewrap"><div class="inning" id="inning"></div></div>
</div>

<div class="card">
  <div class="row between"><b>打撃入力</b><span class="muted">数字はタップして変更</span></div>
  <div class="game-toolbar">
    <button class="quick active" onclick="showBatMode('table',this)">一覧入力</button>
    <button class="quick" onclick="showBatMode('quick',this)">打席結果</button>
  </div>
  <div class="tablewrap"><div class="editor" id="gameBat"></div></div>
</div>

<div class="card">
  <div class="row between"><b>投手入力</b><span class="muted">登板した投手だけ入力</span></div>
  <div class="tablewrap"><div class="editor" id="gamePitch"></div></div>
</div>
</section>
<section id="players" class="hidden"><div class="card"><div class="row between"><div class="title">選手成績</div><button class="btn primary" id="addPlayer">＋ 選手登録</button></div></div><div id="playerList"></div></section>
<section id="player" class="hidden"><div class="row" style="margin-bottom:10px"><button class="btn" id="backPlayers">← 選手一覧</button></div><div class="card"><div class="title" id="playerName"></div><div class="muted">シーズン累計</div></div><div class="card"><div class="stats" id="playerStats"></div></div><div class="card"><b>打撃詳細</b><div class="tablewrap"><table class="table" id="playerBat"></table></div></div><div class="card"><b>投手詳細</b><div class="tablewrap"><table class="table" id="playerPitch"></table></div></div></section>
<section id="settings" class="hidden"><div class="card"><div class="title">設定</div><label>チーム名</label><input id="teamName" placeholder="チーム名"><button class="btn primary" id="saveSettings" style="margin-top:12px">保存</button></div></section></main>
<nav class="bottom"><button id="navHome" class="active">🏆<br>チーム</button><button id="navGames">⚾<br>試合</button><button id="navPlayers">👤<br>選手</button></nav><div id="menu" class="menu hidden"><button id="mHome">🏆 チーム成績</button><button id="mGames">⚾ 試合一覧</button><button id="mPlayers">👤 選手成績</button><button id="mSettings">⚙️ 設定</button></div>
<script>
const KEY='baseball_log_v2';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{teamName:'',players:[],games:[]};db.players=db.players||[];db.games=db.games||[];const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),bat0=()=>({AB:0,H:0,D2:0,D3:0,HR:0,RBI:0,R:0,BB:0,SO:0,SB:0}),pit0=()=>({IP:0,W:0,L:0,S:0,K:0,HA:0,ER:0}),fmt=n=>(n||0).toFixed(3).replace(/^0/,'');let cur=null; let batMode='table';
function ensure(p){p.bat=p.bat||bat0();p.pitch=p.pitch||pit0()}function get(id){return db.players.find(p=>p.id===id)}function show(id){['home','games','game','players','player','settings'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');$('menu').classList.add('hidden');$('navHome').classList.toggle('active',id==='home'||id==='player');$('navGames').classList.toggle('active',id==='games'||id==='game');$('navPlayers').classList.toggle('active',id==='players');if(id==='home')home();if(id==='games')games();if(id==='players')players();if(id==='settings')$('teamName').value=db.teamName||''}
function agg(){let a={};db.players.forEach(p=>{ensure(p);a[p.id]={...bat0(),...pit0(),games:0}});db.games.forEach(g=>{(g.lineup||[]).forEach(id=>{if(a[id])a[id].games++});Object.entries(g.bat||{}).forEach(([id,b])=>{if(a[id])Object.keys(bat0()).forEach(k=>a[id][k]+=+b[k]||0)});Object.entries(g.pitch||{}).forEach(([id,b])=>{if(a[id])Object.keys(pit0()).forEach(k=>a[id][k]+=+b[k]||0)})});return a}
function home(){let a=agg(),t={AB:0,H:0,HR:0,SB:0,IP:0,ER:0},w=0,l=0,d=0,rs=0,ra=0;db.games.filter(x=>x.finished).forEach(x=>{rs+=+x.ourScore||0;ra+=+x.oppScore||0;if(x.ourScore>x.oppScore)w++;else if(x.ourScore<x.oppScore)l++;else d++});Object.values(a).forEach(x=>{t.AB+=x.AB;t.H+=x.H;t.HR+=x.HR;t.SB+=x.SB;t.IP+=x.IP;t.ER+=x.ER});$('teamTitle').textContent=db.teamName||'チーム成績';$('g').textContent=w+l+d;$('wr').textContent=(w/(w+l+d||1)).toFixed(3).replace(/^0/,'');$('rs').textContent=rs;$('ra').textContent=ra;$('avg').textContent=fmt(t.H/(t.AB||1));$('hr').textContent=t.HR;$('sb').textContent=t.SB;$('era').textContent=(t.ER*9/(t.IP||1)).toFixed(2);$('batRows').innerHTML=db.players.map(p=>{let x=a[p.id],avg=x.H/(x.AB||1),ob=(x.H+x.BB)/(x.AB+x.BB||1);return `<tr><td>${p.name}</td><td>${x.AB+x.BB}</td><td>${x.AB}</td><td>${x.H}</td><td>${x.D2}</td><td>${x.D3}</td><td>${x.HR}</td><td>${x.RBI}</td><td>${x.R}</td><td>${x.BB}</td><td>${x.SO}</td><td>${fmt(avg)}</td><td>${fmt(ob)}</td></tr>`}).join('')||'<tr><td colspan="13">選手を登録してください</td></tr>';$('pitchRows').innerHTML=db.players.map(p=>{let x=a[p.id];return x.IP||x.W||x.K||x.ER?`<tr><td>${p.name}</td><td>${x.games}</td><td>${x.IP}</td><td>${x.W}</td><td>${x.L}</td><td>${x.S}</td><td>${x.K}</td><td>${x.HA}</td><td>${x.ER}</td><td>${(x.ER*9/(x.IP||1)).toFixed(2)}</td></tr>`:''}).join('')||'<tr><td colspan="10">投手成績はまだありません</td></tr>'}
function games(){$('gameList').innerHTML=db.games.slice().reverse().map(g=>`<div class="card"><b>${g.date}</b><div class="title" style="margin:5px 0">${g.opp||'相手未設定'}　${g.ourScore}-${g.oppScore}</div><button class="btn primary" onclick="openGame('${g.id}')">試合を開く</button></div>`).join('')||'<div class="card empty">試合がありません</div>'}
function newGame(){let g={id:uid(),date:new Date().toISOString().slice(0,10),opp:'',ourScore:0,oppScore:0,finished:false,lineup:db.players.slice(0,9).map(p=>p.id),bat:{},pitch:{},runs:Array(9).fill(0),oppRuns:Array(9).fill(0)};db.players.forEach(p=>{g.bat[p.id]=bat0();g.pitch[p.id]=pit0()});db.games.push(g);save();openGame(g.id)}
function openGame(id){cur=id;let g=db.games.find(x=>x.id===id);if(!g)return; $('date').textContent=g.date;$('oppTitle').innerHTML=`${g.opp||'相手未設定'} <button class="btn" onclick="info()">編集</button>`;$('ourName').textContent=db.teamName||'自チーム';$('oppName').textContent=g.opp||'相手';$('ourScore').textContent=g.ourScore;$('oppScore').textContent=g.oppScore;inning(g);gameBat(g);gamePitch(g);lineup(g);show('game')}
function info(){let g=db.games.find(x=>x.id===cur);let d=prompt('試合日',g.date);if(d!==null)g.date=d;let o=prompt('相手チーム',g.opp);if(o!==null)g.opp=o;save();openGame(g.id)}
function inning(g){let h='<div class="head">チーム</div>'+Array.from({length:9},(_,i)=>`<div class="head">${i+1}</div>`).join('')+'<div class="head">計</div>';h+=`<div>${db.teamName||'自チーム'}</div>`+g.runs.map((x,i)=>`<div><button class="cell" onclick="run(${i},0)">${x}</button></div>`).join('')+`<div>${g.ourScore}</div>`;h+=`<div>${g.opp||'相手'}</div>`+g.oppRuns.map((x,i)=>`<div><button class="cell" onclick="run(${i},1)">${x}</button></div>`).join('')+`<div>${g.oppScore}</div>`;$('inning').innerHTML=h}
function run(i,s){let g=db.games.find(x=>x.id===cur),arr=s?g.oppRuns:g.runs,v=prompt(`${i+1}回の得点`,arr[i]);if(v!==null){arr[i]=+v||0;g.ourScore=g.runs.reduce((a,b)=>a+b,0);g.oppScore=g.oppRuns.reduce((a,b)=>a+b,0);save();openGame(g.id)}}
const BH=[['AB','打数'],['H','安打'],['D2','二塁'],['D3','三塁'],['HR','本塁打'],['RBI','打点'],['R','得点'],['BB','四球'],['SO','三振'],['SB','盗塁']];
function gameBat(g){
  if(batMode==='quick'){
    let h='<div style="min-width:430px"><div class="p head">選手</div>';
    db.players.forEach((p,i)=>{
      let b=g.bat[p.id]||bat0();
      h+=`<div class="card" style="margin:6px 0;padding:10px"><div class="row between"><b>${i+1}. ${p.name}</b><span class="muted">H ${b.H} / HR ${b.HR} / RBI ${b.RBI}</span></div><div class="result-grid" style="margin-top:7px">
      <button onclick="quickBat('${p.id}','AB')">凡打</button>
      <button onclick="quickBat('${p.id}','H')">安打</button>
      <button onclick="quickBat('${p.id}','D2')">二塁打</button>
      <button onclick="quickBat('${p.id}','D3')">三塁打</button>
      <button onclick="quickBat('${p.id}','HR')">本塁打</button>
      <button onclick="quickBat('${p.id}','BB')">四球</button>
      <button onclick="quickBat('${p.id}','SO')">三振</button>
      <button onclick="quickBat('${p.id}','SB')">盗塁</button>
      <button onclick="bat('${p.id}','RBI')">打点 ${b.RBI}</button>
      <button onclick="bat('${p.id}','R')">得点 ${b.R}</button>
      </div></div>`;
    });
    h+='</div>';$('gameBat').innerHTML=h;return;
  }
  let h='<div class="p head">選手</div>'+BH.map(x=>`<div class="head">${x[1]}</div>`).join('');
  db.players.forEach((p,i)=>{let b=g.bat[p.id]||bat0();h+=`<div class="p">${i+1}. ${p.name}</div>`+BH.map(([k,n])=>`<div><button class="cell" onclick="bat('${p.id}','${k}')">${b[k]}</button></div>`).join('')});
  $('gameBat').innerHTML=h;
}
function showBatMode(mode,btn){batMode=mode;document.querySelectorAll('.game-toolbar .quick').forEach(x=>x.classList.remove('active'));btn.classList.add('active');let g=db.games.find(x=>x.id===cur);gameBat(g)}
function quickBat(id,type){
  let g=db.games.find(x=>x.id===cur); if(!g)return;
  let b=g.bat[id]||(g.bat[id]=bat0());
  if(type==='AB'){b.AB++;} 
  else if(type==='H'){b.AB++;b.H++;}
  else if(type==='D2'){b.AB++;b.H++;b.D2++;}
  else if(type==='D3'){b.AB++;b.H++;b.D3++;}
  else if(type==='HR'){b.AB++;b.H++;b.HR++;}
  else if(type==='BB'){b.BB++;}
  else if(type==='SO'){b.AB++;b.SO++;}
  else if(type==='SB'){b.SB++;}
  save();openGame(g.id);
}
function bat(id,k){let g=db.games.find(x=>x.id===cur),v=prompt(`${get(id).name} ${k}`,g.bat[id][k]||0);if(v!==null){g.bat[id][k]=Math.max(0,+v||0);save();openGame(g.id)}}
const PH=[['IP','投球回'],['W','勝'],['L','負'],['S','セーブ'],['K','奪三振'],['HA','被安打'],['ER','自責点']];function gamePitch(g){let h='<div class="p head">投手</div>'+PH.map(x=>`<div class="head">${x[1]}</div>`).join('');db.players.forEach(p=>{let b=g.pitch[p.id]||pit0();h+=`<div class="p">${p.name}</div>`+PH.map(([k])=>`<div><button class="cell" onclick="pitch('${p.id}','${k}')">${b[k]}</button></div>`).join('')});$('gamePitch').innerHTML=h}
function pitch(id,k){let g=db.games.find(x=>x.id===cur),v=prompt(`${get(id).name} ${k}`,g.pitch[id][k]||0);if(v!==null){g.pitch[id][k]=Math.max(0,+v||0);save();openGame(g.id)}}
function lineup(g){
  $('lineup').innerHTML=`<div class="lineup-grid">
  <div class="head">打順</div><div class="head">選手</div><div class="head">変更</div>
  ${Array.from({length:9},(_,i)=>{let p=get(g.lineup[i]);return `<div class="slot"><b>${i+1}</b></div><div class="slot">${p?p.name:'未登録'}</div><div class="slot"><button class="btn" onclick="setLine(${i})">変更</button></div>`}).join('')}
  </div>`;
}
function setLine(i){let g=db.games.find(x=>x.id===cur),s=db.players.map((p,n)=>`${n+1}: ${p.name}`).join('\n'),v=prompt(`打順${i+1}\n${s}`,'');if(v!==null&&db.players[(+v||0)-1]){g.lineup[i]=db.players[(+v||0)-1].id;save();openGame(g.id)}}
function players(){let a=agg();$('playerList').innerHTML=db.players.map(p=>{let x=a[p.id];return `<div class="card row between" onclick="openPlayer('${p.id}')"><div><b>${p.name}</b><div class="muted">打率 ${fmt(x.H/(x.AB||1))}　安打 ${x.H}　HR ${x.HR}　打点 ${x.RBI}</div></div><b>›</b></div>`}).join('')||'<div class="card empty">選手を登録してください</div>'}
function addPlayer(){let n=prompt('選手名');if(n){db.players.push({id:uid(),name:n,bat:bat0(),pitch:pit0()});save();players()}}
function openPlayer(id){let p=get(id),x=agg()[id],avg=x.H/(x.AB||1),ob=(x.H+x.BB)/(x.AB+x.BB||1);$('playerName').textContent=p.name;$('playerStats').innerHTML=[['試合',x.games],['打率',fmt(avg)],['安打',x.H],['本塁打',x.HR],['打点',x.RBI],['出塁率',fmt(ob)],['盗塁',x.SB],['三振',x.SO]].map(a=>`<div class="stat"><small>${a[0]}</small><strong>${a[1]}</strong></div>`).join('');$('playerBat').innerHTML=Object.entries({打席:x.AB+x.BB,打数:x.AB,安打:x.H,二塁打:x.D2,三塁打:x.D3,本塁打:x.HR,打点:x.RBI,得点:x.R,四球:x.BB,三振:x.SO,盗塁:x.SB,打率:fmt(avg),出塁率:fmt(ob)}).map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join('');$('playerPitch').innerHTML=Object.entries({投球回:x.IP,勝:x.W,負:x.L,セーブ:x.S,奪三振:x.K,被安打:x.HA,自責点:x.ER,防御率:(x.ER*9/(x.IP||1)).toFixed(2)}).map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join('');show('player')}
$('addGame').onclick=$('addGame2').onclick=newGame;$('addPlayer').onclick=addPlayer;$('backGames').onclick=()=>show('games');$('backPlayers').onclick=()=>show('players');$('finish').onclick=()=>{let g=db.games.find(x=>x.id===cur);if(confirm('この試合を終了して保存しますか？')){g.finished=true;save();openGame(g.id)}};$('navHome').onclick=()=>show('home');$('navGames').onclick=()=>show('games');$('navPlayers').onclick=()=>show('players');$('menuBtn').onclick=()=>$('menu').classList.toggle('hidden');$('mHome').onclick=()=>show('home');$('mGames').onclick=()=>show('games');$('mPlayers').onclick=()=>show('players');$('mSettings').onclick=()=>show('settings');$('saveSettings').onclick=()=>{db.teamName=$('teamName').value.trim();save();show('home')};window.openGame=openGame;window.showBatMode=showBatMode;window.quickBat=quickBat;window.info=info;window.run=run;window.bat=bat;window.pitch=pitch;window.setLine=setLine;window.openPlayer=openPlayer;home();
</script></body></html>
